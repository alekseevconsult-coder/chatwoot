#cloud-config
# One-click deploy: paste this into your cloud provider's "User data" / "Cloud-init" box when
# creating a server (Hetzner, DigitalOcean, Vultr, …), then click Create. The server boots and
# installs the entire Omni-Chat-AI stack automatically.
#
# Recommended server: Hetzner CPX31 (4 vCPU / 8 GB RAM, ~$8.50/mo), Ubuntu 24.04.
#
# Fill in the three values below:
#   GITHUB_TOKEN — a GitHub PAT with READ access to the repo (the repo is private). Use a
#                  fine-grained token scoped to just this repo, and revoke it after deploy.
#   DOMAIN       — optional; set for automatic HTTPS (point example.com AND panel.example.com
#                  at the server's IP first). Leave empty to run on the server IP/ports.
#   ACME_EMAIL   — optional; for Let's Encrypt notices when DOMAIN is set.
#
# After ~5–10 min, open  https://panel.<domain>/admin  (or  http://<server-ip>:8080/admin ).

write_files:
  - path: /root/omni-deploy.sh
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      export GITHUB_TOKEN="REPLACE_WITH_GITHUB_TOKEN"
      export DOMAIN=""
      export ACME_EMAIL=""
      REPO="alekseevconsult-coder/chatwoot-artem"
      BRANCH="claude/omni-chat-ai-stack-7ydEC"
      command -v git >/dev/null || (apt-get update -y && apt-get install -y git curl openssl)
      command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
      rm -rf /opt/omni-chat-ai
      git clone --branch "$BRANCH" --depth 1 \
        "https://${GITHUB_TOKEN}@github.com/${REPO}.git" /opt/omni-chat-ai
      cd /opt/omni-chat-ai/omni-chat-ai
      DOMAIN="$DOMAIN" ACME_EMAIL="$ACME_EMAIL" bash ./deploy.sh

runcmd:
  - [ bash, /root/omni-deploy.sh ]
